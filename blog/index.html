<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - Guy Samuels Magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
:root{--bg:#0E1822;--bg-soft:#13202C;--bg-card:#172836;--brand:#29ABE2;--brand-deep:#1787BC;--brand-soft:#7FCDEE;--text:#EDF2F6;--text-soft:#AFBDC8;--muted:#7C8B98;--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.16);}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Karla',sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:60;background:rgba(14,24,34,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1140px;margin:0 auto}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
.brand .suit{color:var(--brand);letter-spacing:0}
.nav-links{display:flex;gap:28px;align-items:center;list-style:none}
.nav-links a{font-size:.92rem;font-weight:500;color:var(--text-soft)}
.nav-links a:hover,.nav-links a.active{color:var(--brand)}
.btn{display:inline-block;background:var(--brand);color:#05121C;font-weight:700;font-size:.95rem;padding:.78em 1.5em;border-radius:4px;transition:background .15s ease}
.btn:hover{background:var(--brand-soft)}
.btn.small{padding:.55em 1.1em;font-size:.88rem}
.blog-hero{padding:80px 0 56px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:block}
.blog-hero h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(2.4rem,5vw,3.8rem);line-height:1.1;margin-bottom:16px}
.blog-hero p{color:var(--text-soft);max-width:52ch;font-size:1.05rem}
.blog-grid-wrap{padding:64px 0 96px}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.post-card{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:border-color .2s ease,transform .2s ease;display:flex;flex-direction:column}
.post-card:hover{border-color:var(--line-strong);transform:translateY(-3px)}
.post-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.post-card-body{padding:24px;flex:1;display:flex;flex-direction:column}
.post-date{font-size:.82rem;color:var(--muted);margin-bottom:10px;display:block}
.post-card-body h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.35rem;line-height:1.2;margin-bottom:12px;color:var(--text)}
.read-more{font-size:.88rem;font-weight:600;color:var(--brand);margin-top:auto;padding-top:12px;display:inline-block}
.read-more:hover{color:var(--brand-soft)}
.no-posts{text-align:center;padding:80px 0;color:var(--text-soft)}
footer.site{background:var(--bg);border-top:1px solid var(--line);padding:32px 0}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.footer-brand{font-weight:700;font-size:.95rem;letter-spacing:.05em;text-transform:uppercase}
.footer-brand .suit{color:var(--brand)}
.footer-links{display:flex;gap:24px}
.footer-links a{font-size:.88rem;color:var(--muted)}
.footer-links a:hover{color:var(--brand)}
.footer-copy{font-size:.82rem;color:var(--muted);width:100%;text-align:center;margin-top:16px}
@media(max-width:760px){.blog-grid{grid-template-columns:1fr}}
</style>
<script src="/tracking.js"></script>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="/">Guy S<span class="suit">♠</span>muels</a>
    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a href="/#services">Services</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#faq">FAQ</a></li>
        <li><a href="/blog/" class="active">Blog</a></li>
        <li class="nav-cta"><a class="btn small" href="/#contact">Check availability</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="blog-hero">
  <div class="wrap">
    <span class="eyebrow">Tips, ideas &amp; magic</span>
    <h1>The Guy Samuels Blog</h1>
    <p>Magic tips, event planning ideas and behind-the-scenes stories from a working close-up magician.</p>
  </div>
</section>

<div class="blog-grid-wrap">
  <div class="wrap">
    <div class="blog-grid" id="post-grid"></div>
  </div>
</div>

<footer class="site">
  <div class="wrap footer-inner">
    <div class="footer-brand">Guy S<span class="suit">♠</span>muels</div>
    <div class="footer-links">
      <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
      <a href="https://facebook.com" target="_blank" rel="noopener">Facebook</a>
    </div>
    <p class="footer-copy">&copy; 2026 Guy Samuels Magic</p>
  </div>
</footer>

<script>
var posts = [
];
var grid = document.getElementById("post-grid");
if (posts.length === 0) {
  grid.innerHTML = "<p class='no-posts'>No posts yet — check back soon.</p>";
} else {
  var html = "";
  for (var i = 0; i < posts.length; i++) {
    var p = posts[i];
    var img = p.image || "/images/placeholder.jpg";
    html += "<a class='post-card' href='/blog/posts/" + p.slug + ".html'>";
    html += "<img src='" + img + "' alt='" + p.title + "' onerror='this.style.display="none"'>";
    html += "<div class='post-card-body'>";
    html += "<span class='post-date'>" + p.date + "</span>";
    html += "<h2>" + p.title + "</h2>";
    html += "<span class='read-more'>Read more</span>";
    html += "</div></a>";
  }
  grid.innerHTML = html;
}
</script>
</body>
</html>
